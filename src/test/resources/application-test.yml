spring:
  # ... (application)

  datasource:
    # Compatibilidad de fechas y caracteres especiales.
    url: jdbc:mysql://localhost:3306/marketplace?createDatabaseIfNotExist=true&serverTimezone=UTC&useLegacyDatetimeCode=false&characterEncoding=UTF-8
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create
      show-sql: true
      properties:
          hibernate.format_sql: true
          hibernate.connection.CharSet: utf8mb4
          hibernate.connection.characterEncoding: utf8mb4
    # ...

  sql:
    init:
      mode: always
      # 🔑 ESTO DEBE ESTAR AQUÍ PARA EL TIMING
      defer-datasource-initialization: true
      separator: ";"